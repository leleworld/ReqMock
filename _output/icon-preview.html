<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><style>html,body{margin:0;padding:0;background:transparent;}svg{display:block;}</style></head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#282a30"/>
      <stop offset="1" stop-color="#151619"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#74acff"/>
      <stop offset="1" stop-color="#3d7de9"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 深色圆角底 -->
  <rect x="24" y="24" width="976" height="976" rx="224" fill="url(#bg)"/>
  <rect x="27" y="27" width="970" height="970" rx="221" fill="none" stroke="#3c4048" stroke-width="6"/>

  <!-- 背后的“请求箭头”：弱化的深蓝箭头，象征请求发出 -->
  <g fill="#31456e">
    <rect x="180" y="472" width="420" height="80" rx="40"/>
    <path d="M 640 380 L 640 644 L 856 512 Z"/>
  </g>

  <!-- 前景闪电：象征 Mock 即时响应 -->
  <polygon filter="url(#glow)" fill="url(#bolt)"
    points="602,132 330,568 492,568 424,892 716,428 546,428 668,132"/>
</svg>
</body>
</html>
